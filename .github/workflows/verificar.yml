# Corre en cada push y en cada pull request, y a mano (Medir IA lo pide después de
# guardar una referencia nueva, porque lo que empuja el token de Actions no dispara nada).
#   codigo       archivos que chocan por mayúsculas en la Mac, tipos, colores de marca,
#                pruebas de permisos sobre PGlite (sin Docker),
#                pruebas del evaluador de la IA, del Excel del equipo y que cada prompt
#                cambiado esté medido.
#                No llama a Claude: la medición corre solo a pedido, con Medir IA
#   migraciones  aplica todas las migraciones sobre la imagen real de Supabase
name: Verificar

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mayusculas:verificar
      - run: npm run typecheck
      - run: npm run marca:verificar
      - run: npm run db:probar
      - run: npm run ia:probar
      - run: node scripts/pruebas/excel.mjs
      - run: node --import ./scripts/ia/cargador.mjs scripts/pruebas/cotizacion.mjs
      # No gasta crédito: compara la huella de cada prompt con scripts/ia/referencias.json.
      # Si un prompt cambió y no se midió, falla y pide correr Medir IA en la rama.
      - run: npm run ia:evaluar -- --verificar-referencias

  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1
      # Levanta solo Postgres con los esquemas de Supabase y aplica supabase/migrations en orden.
      - run: supabase db start
